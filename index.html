<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>マンガ新刊トラッカー</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
:root {
  color-scheme: light dark;
  --pad: 16px;
  --bg: #faf9f7;
  --bg-blur: rgba(250,249,247,.86);
  --surface: #ffffff;
  --surface-2: #f2efe9;
  --line: #e7e2da;
  --text: #1f1d1a;
  --muted: #8b847a;
  --accent: #c2410c;
  --accent-bg: #fdeadf;
  --soon: #1d4ed8;
  --soon-bg: #e0eafc;
  --shadow: 0 1px 2px rgba(28,22,16,.06), 0 6px 16px rgba(28,22,16,.07);
  --shadow-lg: 0 8px 40px rgba(28,22,16,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131211;
    --bg-blur: rgba(19,18,17,.86);
    --surface: #1e1c1a;
    --surface-2: #272421;
    --line: #302c28;
    --text: #f1ede7;
    --muted: #9b938a;
    --accent: #ff8f63;
    --accent-bg: #40241a;
    --soon: #93b4f8;
    --soon-bg: #1e2c47;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 48px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: max(14px, env(safe-area-inset-top)) var(--pad) calc(56px + env(safe-area-inset-bottom));
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.5;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
}

header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .015em; }
.sub { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  padding: 10px 8px 9px; text-align: center;
}
.stat .n { font-size: 22px; font-weight: 660; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: .01em; }
.stat.hot { background: var(--accent-bg); border-color: transparent; }
.stat.hot .n { color: var(--accent); }
.stat.hot .l { color: var(--accent); opacity: .8; }
.stat.cool { background: var(--soon-bg); border-color: transparent; }
.stat.cool .n { color: var(--soon); }
.stat.cool .l { color: var(--soon); opacity: .8; }

.tabbar {
  position: sticky; top: 0; z-index: 20;
  margin: 0 calc(var(--pad) * -1) 14px;
  padding: 9px var(--pad) 10px;
  background: var(--bg-blur);
  backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
}
.tabs {
  display: flex; gap: 3px; padding: 3px;
  background: var(--surface-2); border-radius: 12px;
}
.tab {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  padding: 8px 4px; border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; touch-action: manipulation;
  transition: background .18s, color .18s;
}
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 11px; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 18px 14px; } }
@media (min-width: 760px) { body { max-width: 940px; margin: 0 auto; } .grid { grid-template-columns: repeat(6, 1fr); } }

.card { cursor: pointer; position: relative; }
.card:active .cover { transform: scale(.965); }

.cover {
  position: relative; width: 100%; aspect-ratio: 2 / 3;
  border-radius: 9px; overflow: hidden;
  background: var(--surface-2); box-shadow: var(--shadow);
  transition: transform .16s ease;
}
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: space-between; padding: 9px 8px;
  background: linear-gradient(155deg, hsl(var(--h) 30% 50%), hsl(var(--h2) 34% 27%));
  color: #fff;
}
.ph .t { font-size: 10.5px; font-weight: 600; line-height: 1.3; letter-spacing: .01em;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  text-shadow: 0 1px 3px rgba(0,0,0,.3); }
.ph .v { font-size: 22px; font-weight: 700; text-align: right; opacity: .92; letter-spacing: -.02em; }
.ph .v small { font-size: 11px; font-weight: 500; }

.tag {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px;
  letter-spacing: .02em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 1px 5px rgba(0,0,0,.22);
}
.t-new { background: #e2510b; color: #fff; }
.t-soon { background: rgba(255,255,255,.94); color: #14387f; }
@media (prefers-color-scheme: dark) { .t-soon { background: rgba(28,26,24,.9); color: #a9c4fb; } }

.plus {
  position: absolute; right: 5px; bottom: 5px; z-index: 2;
  width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0;
  background: rgba(20,18,16,.62); color: #fff; font-size: 18px; line-height: 1;
  cursor: pointer; font-family: inherit; touch-action: manipulation;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .18s;
}
.card .plus { opacity: .9; }
.plus:active { background: rgba(20,18,16,.85); transform: scale(.9); }

.tt { font-size: 11.5px; font-weight: 600; line-height: 1.35; margin-top: 7px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mt { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mt b { color: var(--accent); font-weight: 700; }

.empty { grid-column: 1 / -1; padding: 50px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

/* ---- detail sheet ---- */
.scrim {
  position: fixed; inset: 0; z-index: 40; background: rgba(12,10,9,.5);
  opacity: 0; pointer-events: none; transition: opacity .22s;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 8px var(--pad) calc(22px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
  transform: translateY(102%); transition: transform .26s cubic-bezier(.32,.72,0,1);
  max-height: 88vh; overflow-y: auto;
}
.sheet.open { transform: translateY(0); }
@media (min-width: 640px) {
  .sheet { left: 50%; right: auto; bottom: 24px; width: 460px; transform: translate(-50%, 130%); border-radius: 20px; }
  .sheet.open { transform: translate(-50%, 0); }
}
.grip { width: 38px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
.sh-top { display: flex; gap: 14px; }
.sh-cover { width: 92px; flex: 0 0 92px; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
  position: relative; box-shadow: var(--shadow); background: var(--surface-2); }
.sh-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sh-info { flex: 1; min-width: 0; }
.sh-title { font-size: 16px; font-weight: 700; line-height: 1.35; }
.sh-rows { margin-top: 9px; font-size: 12.5px; color: var(--muted); line-height: 1.75; }
.sh-rows b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.sh-note { margin-top: 8px; font-size: 11.5px; color: var(--muted); background: var(--surface-2);
  padding: 7px 9px; border-radius: 8px; line-height: 1.5; }

.counter { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 18px; }
.counter button {
  width: 56px; height: 50px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); font-size: 24px; line-height: 1;
  cursor: pointer; font-family: inherit; padding: 0; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.counter button:active { transform: scale(.93); }
.counter .v { min-width: 96px; text-align: center; font-variant-numeric: tabular-nums;
  font-size: 27px; font-weight: 700; letter-spacing: -.02em; }
.counter .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.sh-hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

.foot { margin-top: 30px; padding-top: 15px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.foot .btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.foot button {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-family: inherit;
  padding: 8px 13px; border-radius: 9px; font-size: 11.5px; cursor: pointer; touch-action: manipulation;
}
.foot button:active { background: var(--surface-2); }
.credit { margin-top: 12px; font-size: 10.5px; opacity: .75; }
.credit a { color: inherit; }
</style>
</head>
<body>

<header>
  <h1>マンガ新刊トラッカー</h1>
  <div class="sub">更新 <span id="updated"></span></div>
</header>

<div class="stats">
  <div class="stat hot"><div class="n" id="c-unread">0</div><div class="l">未読の巻</div></div>
  <div class="stat hot"><div class="n" id="c-titles">0</div><div class="l">新刊あり</div></div>
  <div class="stat cool"><div class="n" id="c-soon">0</div><div class="l">発売間近</div></div>
  <div class="stat"><div class="n" id="c-all">0</div><div class="l">登録作品</div></div>
</div>

<div class="tabbar">
  <div class="tabs">
    <button class="tab on" data-f="unread">未読あり</button>
    <button class="tab" data-f="soon">発売間近</button>
    <button class="tab" data-f="all">すべて</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="foot">
  表紙をタップすると巻数を変更できます。読んだ記録はこの端末に保存され、次に開いても残ります。<br>
  作品の追加・削除はチャットから依頼してください。
  <div class="btns">
    <button id="export">データを書き出す</button>
    <button id="import">データを読み込む</button>
    <button id="reset">既読をリセット</button>
  </div>
  <div class="credit">書影提供: <a href="https://ndlsearch.ndl.go.jp/" target="_blank" rel="noopener">国立国会図書館サーチ</a></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
// ==== 最新刊カタログ ====
const UPDATED = "2026-08-15";
const CATALOG = [
  {t:"魔入りました！入間くん", init:49, latest:49, ld:"2026-06-08", next:50, nd:"2026-09-08", nc:"確定", isbn:"9784253013864"},

  {t:"夏目友人帳", init:33, latest:33, ld:"2026-04-03", next:34, nd:null, nc:"未定", isbn:"9784592222033"},

  {t:"メダリスト", init:15, latest:15, ld:"2026-07-22", next:16, nd:null, nc:"未定", isbn:"9784065442401"},
  {t:"絢爛たるグランドセーヌ", init:30, latest:30, ld:"2026-07-17", next:31, nd:"2026-12-16", nc:"予想", isbn:"9784253018234"},
  {t:"お隣の天使様（漫画版）", init:7, latest:7, ld:"2026-06-05", next:8, nd:null, nc:"未定", note:"スピンオフ「after the rain」は3巻まで", isbn:"9784301005667"},
  {t:"ふつつかな悪女ではございますが（漫画）", init:10, latest:10, ld:"2026-03-31", next:11, nd:"2026-09-30", nc:"確定", isbn:"9784758098090"},
  {t:"月刊少女野崎くん", init:17, latest:18, ld:"2026-08-10", next:19, nd:null, nc:"未定", isbn:"9784301005476"},
  {t:"とんでもスキルで異世界放浪メシ（漫画）", init:10, latest:11, ld:"2025-07-25", next:12, nd:"2026-12-23", nc:"予想", isbn:"9784824012777"},
  {t:"メイドインアビス", init:14, latest:14, ld:"2025-08-08", next:15, nd:"2026-08-26", nc:"確定", note:"電子版は8/17先行配信", isbn:"9784801987104"},
  {t:"小林さんちのメイドラゴン", init:19, latest:19, ld:"2026-04-09", next:20, nd:"2026-09-03", nc:"予想", isbn:"9784575862065"},
  {t:"アンサングシンデレラ 病院薬剤師 葵みどり", init:15, latest:15, ld:"2025-07-18", next:16, nd:null, nc:"未定", note:"完結（全15巻・15巻が最終巻）", isbn:"9784867207840"},
  {t:"フラジャイル 病理医岸京一郎の所見", init:31, latest:31, ld:"2026-03-23", next:32, nd:"2026-09-18", nc:"確定", isbn:"9784065428597"},
  {t:"死役所", init:28, latest:28, ld:"2025-07-09", next:29, nd:null, nc:"未定", isbn:"9784107728524"},
  {t:"光が死んだ夏", init:9, latest:9, ld:"2026-06-04", next:10, nd:"2026-11-10", nc:"予想", isbn:"9784041174807"},
  {t:"スーパーの裏でヤニ吸うふたり", init:8, latest:9, ld:"2026-07-24", next:10, nd:null, nc:"未定", isbn:"9784301006565"},
  {t:"星旅少年 -Planetarium ghost travel-", init:6, latest:6, ld:"2026-01-23", next:7, nd:null, nc:"未定", isbn:"9784756260840"},
  {t:"鴻池剛と猫のぽんた ニャアアアン！", init:4, latest:4, ld:"2026-02-26", next:5, nd:null, nc:"未定", isbn:"9784047388123"},
  {t:"同居人はひざ、時々、頭のうえ。", init:12, latest:12, ld:"2025-12-15", next:13, nd:"2026-12-17", nc:"予想", isbn:"9784866754734"},
  {t:"おじさまと猫", init:17, latest:17, ld:"2026-06-11", next:18, nd:"2026-11-11", nc:"予想", isbn:"9784301005803"},
  {t:"夜は猫といっしょ", init:8, latest:9, ld:"2026-07-08", next:10, nd:null, nc:"未定", isbn:"9784046602572"},
  {t:"うちの猫がまた変なことしてる。", init:8, latest:8, ld:"2024-09-19", next:9, nd:null, nc:"未定", note:"コミックエッセイ・刊行間隔は不定期", isbn:"9784046834904"},
  {t:"魔男のイチ", init:9, latest:9, ld:"2026-07-03", next:10, nd:"2026-10-02", nc:"予想", isbn:"9784088851013"},
  {t:"とんがり帽子のアトリエ", init:16, latest:16, ld:"2026-04-23", next:17, nd:"2026-09-23", nc:"予想", isbn:"9784065431528"}
];
// ==== ここまで ====

const KEY = "manga-tracker-read-v2";
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { store = {}; }
let filter = "unread";
let openIdx = -1;

const read  = m => (m.t in store) ? store[m.t] : m.init;
const days  = d => d ? Math.round((new Date(d+"T00:00:00") - TODAY) / 86400000) : null;
const fmt   = d => d ? (+d.slice(5,7)) + "/" + (+d.slice(8,10)) + "（" + d.slice(2,4) + "年）" : "未定";
const esc   = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cover = m => m.isbn ? "https://ndlsearch.ndl.go.jp/thumbnail/" + m.isbn + ".jpg" : null;
const save  = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };

function hueOf(t) {
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return h % 360;
}
function state(m) {
  if (read(m) < m.latest) return "unread";
  const dn = days(m.nd);
  if (dn !== null && dn >= 0 && dn <= 60) return "soon";
  return "ok";
}
function coverHTML(m, cls) {
  const h = hueOf(m.t), src = cover(m);
  return '<div class="' + cls + '" style="--h:' + h + ';--h2:' + ((h + 26) % 360) + '">' +
    '<div class="ph"><div class="t">' + esc(m.t) + '</div>' +
    '<div class="v">' + m.latest + '<small>巻</small></div></div>' +
    (src ? '<img src="' + src + '" alt="" loading="lazy" decoding="async" ' +
           'referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
  '</div>';
}

function render() {
  const rows = CATALOG.map((m, i) => ({m, i, s: state(m), gap: Math.max(0, m.latest - read(m))}));

  document.getElementById("c-unread").textContent = rows.reduce((a,r)=>a+r.gap, 0);
  document.getElementById("c-titles").textContent = rows.filter(r=>r.gap>0).length;
  document.getElementById("c-soon").textContent   = rows.filter(r=>r.s==="soon").length;
  document.getElementById("c-all").textContent    = CATALOG.length;

  let show = rows;
  if (filter === "unread")    show = rows.filter(r => r.gap > 0);
  else if (filter === "soon") show = rows.filter(r => r.m.nd && days(r.m.nd) >= 0);

  const rank = {unread:0, soon:1, ok:2};
  if (filter === "soon") {
    show = show.slice().sort((a,b) => a.m.nd.localeCompare(b.m.nd));
  } else {
    show = show.slice().sort((a,b) => {
      const d = rank[a.s] - rank[b.s];
      if (d) return d;
      if (a.s === "soon")   return a.m.nd.localeCompare(b.m.nd);
      if (a.s === "unread") return b.gap - a.gap;
      return (b.m.ld||"").localeCompare(a.m.ld||"");
    });
  }

  const grid = document.getElementById("grid");
  if (!show.length) {
    grid.innerHTML = '<div class="empty">' +
      (filter === "soon"   ? "発売日が判明している次巻はありません。"
       : filter === "unread" ? "未読はありません。全部追いつけています 🎉"
       : "作品がありません。") + '</div>';
    return;
  }

  grid.innerHTML = show.map(({m, i, s, gap}) => {
    const dn = days(m.nd);
    let tag = "";
    if (gap > 0) tag = '<span class="tag t-new">未読 ' + gap + '</span>';
    else if (s === "soon") tag = '<span class="tag t-soon">' + (dn === 0 ? '本日' : 'あと' + dn + '日') + '</span>';

    return '<div class="card" data-i="' + i + '">' +
      tag +
      coverHTML(m, "cover") +
      '<button class="plus" data-plus="' + i + '" aria-label="1巻読んだ">＋</button>' +
      '<div class="tt">' + esc(m.t) + '</div>' +
      '<div class="mt">' + (gap > 0 ? '<b>' + read(m) + '</b>' : read(m)) + ' / ' + m.latest + '巻</div>' +
    '</div>';
  }).join("");

  tallyCovers();
}

/* 書影が実際に取得できたかをコンソールに要約（動作確認用） */
let tallyTimer = null;
function tallyCovers() {
  clearTimeout(tallyTimer);
  tallyTimer = setTimeout(() => {
    const imgs = document.querySelectorAll(".grid .cover img");
    let ok = 0;
    imgs.forEach(im => { if (im.complete && im.naturalWidth > 0) ok++; });
    const withIsbn = CATALOG.filter(m => m.isbn).length;
    console.log("[cover] 表示中タイル " + document.querySelectorAll(".grid .card").length +
                " / 書影読み込み成功 " + ok + " / ISBN登録 " + withIsbn + "件");
  }, 2500);
}

/* ---- 詳細シート ---- */
function openSheet(i) {
  openIdx = i;
  const m = CATALOG[i], dn = days(m.nd);
  const nextLine = m.nd
    ? m.next + '巻 ' + fmt(m.nd) + (m.nc === "予想" ? " 予想" : " 予定") +
      (dn !== null && dn >= 0 ? '（あと' + dn + '日）' : '')
    : m.next + '巻 発売日未定';

  document.getElementById("sheet").innerHTML =
    '<div class="grip"></div>' +
    '<div class="sh-top">' +
      coverHTML(m, "sh-cover") +
      '<div class="sh-info">' +
        '<div class="sh-title">' + esc(m.t) + '</div>' +
        '<div class="sh-rows">' +
          '既刊 <b>' + m.latest + '巻</b>' + (m.ld ? '・' + fmt(m.ld) : '') + '<br>' +
          '次: ' + esc(nextLine) +
        '</div>' +
        (m.note ? '<div class="sh-note">' + esc(m.note) + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="counter">' +
      '<button data-d="-1" aria-label="減らす">−</button>' +
      '<span class="v" id="sh-v">' + read(m) + '<small>巻まで読んだ</small></span>' +
      '<button data-d="1" aria-label="増やす">＋</button>' +
    '</div>' +
    '<div class="sh-hint">背景をタップすると閉じます</div>';

  document.getElementById("sheet").classList.add("open");
  document.getElementById("scrim").classList.add("open");
}
function closeSheet() {
  openIdx = -1;
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}

document.getElementById("grid").addEventListener("click", e => {
  const p = e.target.closest("button[data-plus]");
  if (p) {
    e.stopPropagation();
    const m = CATALOG[+p.dataset.plus];
    store[m.t] = Math.max(0, read(m) + 1);
    save(); render();
    return;
  }
  const c = e.target.closest(".card");
  if (c) openSheet(+c.dataset.i);
});

document.getElementById("sheet").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (!b || openIdx < 0) return;
  const m = CATALOG[openIdx];
  store[m.t] = Math.max(0, read(m) + (+b.dataset.d));
  save();
  document.getElementById("sh-v").innerHTML = read(m) + '<small>巻まで読んだ</small>';
  render();
});

document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

document.querySelectorAll(".tab").forEach(tb => tb.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  tb.classList.add("on");
  filter = tb.dataset.f;
  render();
  window.scrollTo({top: 0, behavior: "smooth"});
}));

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("既読巻数を初期状態に戻します。よろしいですか？")) return;
  store = {}; save(); render();
});

document.getElementById("export").addEventListener("click", () => {
  const data = {};
  CATALOG.forEach(m => { data[m.t] = read(m); });
  prompt("この内容をコピーして保管してください。別の端末では「データを読み込む」に貼り付けます。", JSON.stringify(data));
});

document.getElementById("import").addEventListener("click", () => {
  const s = prompt("書き出したデータを貼り付けてください。");
  if (!s) return;
  try {
    const data = JSON.parse(s);
    if (typeof data !== "object" || data === null || Array.isArray(data)) throw new Error("形式が違います");
    let n = 0;
    CATALOG.forEach(m => {
      const v = data[m.t];
      if (typeof v === "number" && isFinite(v) && v >= 0) { store[m.t] = Math.floor(v); n++; }
    });
    save(); render();
    alert(n + "作品の既読巻数を読み込みました。");
  } catch (e) {
    alert("読み込めませんでした: " + e.message);
  }
});

document.getElementById("updated").textContent = UPDATED;
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
