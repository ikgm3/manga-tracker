<style>
:root {
  color-scheme: light dark;
  --pad: 16px;
  --bg: #faf9f7;
  --bg-blur: rgba(250,249,247,.86);
  --surface: #ffffff;
  --surface-2: #f2efe9;
  --line: #e7e2da;
  --text: #1f1d1a;
  --muted: #8b847a;
  --accent: #c2410c;
  --accent-bg: #fdeadf;
  --accent-line: #f0c4ac;
  --accent-tint: #fffaf7;
  --soon: #1d4ed8;
  --soon-bg: #e0eafc;
  --soon-line: #cfe0f5;
  --soon-tint: #f9fbff;
  --ok-bg: #e7ece5;
  --ok: #56705a;
  --shadow: 0 1px 2px rgba(28,22,16,.05), 0 4px 12px rgba(28,22,16,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131211;
    --bg-blur: rgba(19,18,17,.86);
    --surface: #1e1c1a;
    --surface-2: #272421;
    --line: #302c28;
    --text: #f1ede7;
    --muted: #9b938a;
    --accent: #ff8f63;
    --accent-bg: #40241a;
    --accent-line: #5b3324;
    --accent-tint: #241a15;
    --soon: #93b4f8;
    --soon-bg: #1e2c47;
    --soon-line: #2b3d5e;
    --soon-tint: #171b23;
    --ok-bg: #26302a;
    --ok: #9dbba4;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: max(14px, env(safe-area-inset-top)) var(--pad) calc(96px + env(safe-area-inset-bottom));
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.5;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
}

header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .015em; }
.sub { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  padding: 10px 8px 9px; text-align: center;
}
.stat .n { font-size: 22px; font-weight: 660; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: .01em; }
.stat.hot { background: var(--accent-bg); border-color: transparent; }
.stat.hot .n { color: var(--accent); }
.stat.hot .l { color: var(--accent); opacity: .8; }
.stat.cool { background: var(--soon-bg); border-color: transparent; }
.stat.cool .n { color: var(--soon); }
.stat.cool .l { color: var(--soon); opacity: .8; }

.tabbar {
  position: sticky; top: 0; z-index: 20;
  margin: 0 calc(var(--pad) * -1) 13px;
  padding: 9px var(--pad) 10px;
  background: var(--bg-blur);
  backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
}
.tabs { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
.tab {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  padding: 8px 4px; border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; touch-action: manipulation;
  transition: background .18s, color .18s;
}
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.list { display: flex; flex-direction: column; gap: 9px; }
.row {
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  padding: 13px 14px;
  display: flex; gap: 12px; align-items: flex-start;
}
.row.unread { border-color: var(--accent-line); background: var(--accent-tint); }
.row.soon   { border-color: var(--soon-line);  background: var(--soon-tint); }
.main { flex: 1; min-width: 0; }

.thumb {
  flex: 0 0 auto; width: 46px; aspect-ratio: 2 / 3;
  border-radius: 5px; overflow: hidden; position: relative;
  background: var(--surface-2);
  box-shadow: 0 1px 3px rgba(28,22,16,.18);
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(150deg, hsl(var(--h) 26% 52%), hsl(var(--h2) 30% 32%));
  color: #fff; font-size: 14px; font-weight: 700; letter-spacing: -.02em;
}

.tt { font-weight: 650; font-size: 15px; line-height: 1.35; letter-spacing: .01em; }
.meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

.badge { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; letter-spacing: .02em; }
.b-new  { background: var(--accent-bg); color: var(--accent); }
.b-soon { background: var(--soon-bg);   color: var(--soon); }
.b-ok   { background: var(--ok-bg);     color: var(--ok); }
.b-wait { background: var(--surface-2); color: var(--muted); }

.bottom {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line);
}
.info { font-size: 12px; color: var(--muted); line-height: 1.45; }
.info b { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 650; }
.info b.gap { color: var(--accent); }
.info .next { font-size: 11.5px; opacity: .85; margin-top: 1px; }

.counter { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.counter button {
  width: 44px; height: 44px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font-size: 21px; line-height: 1;
  cursor: pointer; font-family: inherit; padding: 0; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.counter button:active { background: var(--surface-2); transform: scale(.93); }
.counter .v { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.counter .v small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 1px; }

.empty { padding: 46px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

.foot { margin-top: 28px; padding-top: 15px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.foot .btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.foot button {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-family: inherit;
  padding: 9px 14px; border-radius: 9px; font-size: 11.5px; cursor: pointer; touch-action: manipulation;
}
.foot button:active { background: var(--surface-2); }
.foot a { color: var(--soon); text-decoration: none; }
.credit { margin-top: 12px; font-size: 10.5px; opacity: .75; }

/* 右下に固定する「作品を追加」ボタン */
.fab {
  position: fixed; z-index: 30;
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(18px + env(safe-area-inset-bottom));
  display: inline-flex; align-items: center; gap: 7px;
  padding: 13px 18px 13px 15px; border-radius: 999px;
  background: #1f1d1a; color: #faf9f7;
  font-size: 13.5px; font-weight: 650; letter-spacing: .01em;
  text-decoration: none; touch-action: manipulation;
  box-shadow: 0 3px 8px rgba(28,22,16,.2), 0 10px 28px rgba(28,22,16,.22);
  transition: transform .16s ease, box-shadow .16s ease;
}
.fab .p { font-size: 18px; line-height: 1; margin-top: -1px; }
.fab:active { transform: scale(.95); box-shadow: 0 2px 6px rgba(28,22,16,.24); }
@media (prefers-color-scheme: dark) {
  .fab { background: #f1ede7; color: #131211;
         box-shadow: 0 3px 10px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45); }
}

@media (min-width: 700px) {
  body { max-width: 840px; margin: 0 auto; }
  .row { align-items: center; }
  .thumb { width: 54px; }
  .main { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  .bottom { margin-top: 0; padding-top: 0; border: 0; flex-direction: row-reverse; gap: 16px; }
}
</style>

const KEY = "manga-tracker-read-v2";
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { store = {}; }
let filter = "unread";

const read = m => (m.t in store) ? store[m.t] : m.init;
const days = d => d ? Math.round((new Date(d+"T00:00:00") - TODAY) / 86400000) : null;
const fmt  = d => d ? (+d.slice(5,7)) + "/" + (+d.slice(8,10)) + "（" + d.slice(2,4) + "年）" : "未定";
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };

/** 表紙が無い作品用に、作品名から安定した色を作る */
function hueOf(t) {
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return h % 360;
}

function state(m) {
  if (read(m) < m.latest) return "unread";
  const dn = days(m.nd);
  if (dn !== null && dn >= 0 && dn <= 60) return "soon";
  return "ok";
}

function render() {
  const list = document.getElementById("list");
  const rows = CATALOG.map(m => ({m, s: state(m), gap: Math.max(0, m.latest - read(m))}));

  document.getElementById("c-unread").textContent = rows.reduce((a,r)=>a+r.gap, 0);
  document.getElementById("c-titles").textContent = rows.filter(r=>r.gap>0).length;
  document.getElementById("c-soon").textContent   = rows.filter(r=>r.s==="soon").length;
  document.getElementById("c-all").textContent    = CATALOG.length;

  let show = rows;
  if (filter === "unread")    show = rows.filter(r => r.gap > 0);
  else if (filter === "soon") show = rows.filter(r => r.m.nd && days(r.m.nd) >= 0);

  const rank = {unread:0, soon:1, ok:2};
  if (filter === "soon") {
    show = show.slice().sort((a,b) => a.m.nd.localeCompare(b.m.nd));
  } else {
    show = show.slice().sort((a,b) => {
      const d = rank[a.s] - rank[b.s];
      if (d) return d;
      if (a.s === "soon")   return a.m.nd.localeCompare(b.m.nd);
      if (a.s === "unread") return b.gap - a.gap;
      return (b.m.ld||"").localeCompare(a.m.ld||"");
    });
  }

  if (!show.length) {
    list.innerHTML = '<div class="empty">' +
      (filter === "soon"     ? "発売日が判明している次巻はありません。"
       : filter === "unread" ? "未読はありません。全部追いつけています 🎉"
       : "作品がありません。") + '</div>';
    return;
  }

  list.innerHTML = show.map(({m, s, gap}) => {
    const r = read(m), dn = days(m.nd);
    let badge = '<span class="badge b-ok">最新</span>';
    if (gap > 0) badge = '<span class="badge b-new">未読 ' + gap + '冊</span>';
    else if (dn !== null && dn >= 0) {
      badge = '<span class="badge ' + (s === "soon" ? 'b-soon' : 'b-wait') + '">' +
              (dn === 0 ? '本日発売' : 'あと' + dn + '日') + '</span>';
    }
    const nextLine = m.nd
      ? '次: ' + m.next + '巻 ' + fmt(m.nd) + (m.nc === "予想" ? " 予想" : " 予定")
      : '次: ' + m.next + '巻 発売日未定';

    const h = hueOf(m.t);
    const thumb = '<div class="thumb" style="--h:' + h + ';--h2:' + ((h + 26) % 360) + '">' +
      '<div class="ph">' + m.latest + '</div>' +
      (m.img ? '<img src="' + esc(m.img) + '" alt="" loading="lazy" decoding="async" ' +
               'onerror="this.remove()">' : '') +
    '</div>';

    return '<div class="row ' + (gap>0 ? 'unread' : s==='soon' ? 'soon' : '') + '">' +
      thumb +
      '<div class="main">' +
      '<div>' +
        '<div class="tt">' + esc(m.disp || m.t) + '</div>' +
        '<div class="meta">' + badge + (m.note ? '<span>' + esc(m.note) + '</span>' : '') + '</div>' +
      '</div>' +
      '<div class="bottom">' +
        '<div class="info">既刊 <b' + (gap>0 ? ' class="gap"' : '') + '>' + m.latest + '巻</b>' +
        (m.ld ? ' ・ ' + fmt(m.ld) : '') +
        '<div class="next">' + nextLine + '</div></div>' +
        '<div class="counter">' +
          '<button data-d="-1" data-t="' + esc(m.t) + '" aria-label="減らす">−</button>' +
          '<span class="v">' + r + '<small>巻</small></span>' +
          '<button data-d="1" data-t="' + esc(m.t) + '" aria-label="増やす">＋</button>' +
        '</div>' +
      '</div>' +
      '</div>' +
    '</div>';
  }).join("");
}

document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const m = CATALOG.find(x => x.t === b.dataset.t);
  if (!m) return;
  store[m.t] = Math.max(0, read(m) + (+b.dataset.d));
  save(); render();
});

document.querySelectorAll(".tab").forEach(tb => tb.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  tb.classList.add("on");
  filter = tb.dataset.f;
  render();
  window.scrollTo({top: 0, behavior: "smooth"});
}));

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("既読巻数を初期状態に戻します。よろしいですか？")) return;
  store = {}; save(); render();
});

document.getElementById("export").addEventListener("click", () => {
  const data = {};
  CATALOG.forEach(m => { data[m.t] = read(m); });
  prompt("この内容をコピーして保管してください。別の端末では「データを読み込む」に貼り付けます。", JSON.stringify(data));
});

document.getElementById("import").addEventListener("click", () => {
  const s = prompt("書き出したデータを貼り付けてください。");
  if (!s) return;
  try {
    const data = JSON.parse(s);
    if (typeof data !== "object" || data === null || Array.isArray(data)) throw new Error("形式が違います");
    let n = 0;
    CATALOG.forEach(m => {
      const v = data[m.t];
      if (typeof v === "number" && isFinite(v) && v >= 0) { store[m.t] = Math.floor(v); n++; }
    });
    save(); render();
    alert(n + "作品の既読巻数を読み込みました。");
  } catch (e) {
    alert("読み込めませんでした: " + e.message);
  }
});

document.getElementById("updated").textContent = UPDATED;
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
