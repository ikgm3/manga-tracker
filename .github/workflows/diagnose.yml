name: 作品の取得内容を調べる

on:
  workflow_dispatch:
    inputs:
      titles:
        description: "調べる作品名（カンマ区切り。空欄なら誤検出の報告があった4作品）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 楽天が返す商品を1件ずつ表示
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          TITLES: ${{ github.event.inputs.titles }}
        run: |
          if [ -n "$TITLES" ]; then
            IFS=',' read -ra ARR <<< "$TITLES"
            node scripts/inspect-title.mjs "${ARR[@]}"
          else
            node scripts/inspect-title.mjs
          fi
