name: 作品を追加
description: トラッカーに漫画を追加します
title: "作品を追加"
labels: ["add-title"]
body:
  - type: markdown
    attributes:
      value: |
        **上の「Title」欄は入力済みなので、そのままで構いません。**
        下の2つだけ埋めて送信してください。1〜2分で反映され、結果がこのIssueに返信されます。

  - type: input
    id: title
    attributes:
      label: 作品名
      description: |
        楽天ブックスで検索する名前です。だいたいで構いません。
        画面に出る正式タイトルは自動で取得するので、多少違っていても直ります。
      placeholder: 葬送のフリーレン
    validations:
      required: true

  - type: input
    id: read
    attributes:
      label: 既読巻数
      description: 今どこまで読み終えているか。まだ読んでいなければ 0。
      placeholder: "12"
    validations:
      required: true
